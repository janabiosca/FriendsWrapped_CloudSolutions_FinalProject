AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Spotify Friends Wrapped - phase 1, reliable collection of each friend's listening history

Parameters:
  SpotifyClientId:
    Type: String
    Description: Client ID of the Spotify app (developer.spotify.com/dashboard)
  GroupId:
    Type: String
    Default: friends
  CollectSchedule:
    Type: String
    Default: rate(1 hour)
    Description: How often plays are collected. Use rate(5 minutes) for the demo.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional address that receives an email when a collection ends in the dead-letter queue
  ExecutionRoleName:
    Type: String
    Default: LabRole
    Description: AWS Academy does not allow creating IAM roles, so every function runs as the lab role

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: python3.13
    CodeUri: src/
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        RAW_BUCKET: !Ref RawBucket
        QUEUE_URL: !Ref CollectQueue
        GROUP_ID: !Ref GroupId
        SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
        SECRET_PREFIX: !Sub ${AWS::StackName}/spotify/

Resources:
  # Single table: plays, profiles and group membership, organised by person and by group.
  #   USER#<id>   / PROFILE                      sync cursor, last sync status, display name
  #   USER#<id>   / PLAY#<played_at>#<track_id>  one item per play
  #   GROUP#<id>  / MEMBER#<user_id>             who belongs to the group
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}

  # Raw Spotify responses, kept so the statistics can be rebuilt if the table schema changes.
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # FIFO with one message group per user: users are collected in parallel, but the same
  # user is never processed twice at once (Spotify refresh tokens can rotate on use).
  CollectQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CollectDLQ.Arn
        maxReceiveCount: 3

  CollectDLQ:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dispatcher.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${ExecutionRoleName}
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: !Ref CollectSchedule

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: collector.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${ExecutionRoleName}
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt CollectQueue.Arn
            BatchSize: 1

  AlarmTopic:
    Type: AWS::SNS::Topic

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  CollectionFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A user's collection failed 3 times. Plays are lost if it is not fixed before that user plays 50 more songs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt CollectDLQ.QueueName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  TableName:
    Value: !Ref Table
  RawBucket:
    Value: !Ref RawBucket
  SecretPrefix:
    Value: !Sub ${AWS::StackName}/spotify/
  GroupId:
    Value: !Ref GroupId
  DispatcherFunction:
    Description: Invoke it by hand to trigger a collection during the demo
    Value: !Ref DispatcherFunction
  CollectQueueUrl:
    Value: !Ref CollectQueue
  CollectDLQUrl:
    Value: !Ref CollectDLQ
